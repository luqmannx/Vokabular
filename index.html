<style>
:root{--bg:#08090c;--panel:#11131a;--line:rgba(255,255,255,.11);--text:#f8f8fb;--text-soft:rgba(248,248,251,.86);--muted:rgba(248,248,251,.64);--dim:rgba(248,248,251,.46);--soft-panel:rgba(255,255,255,.045);--soft-panel-hover:rgba(255,255,255,.09);--accent:#d8dbe2;--accent-border:rgba(255,255,255,.18)}
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:linear-gradient(180deg,#090a0f 0%,#08090d 55%,#07080b 100%);color:var(--text);font-family:Inter,sans-serif;min-height:100vh;transition:background .25s,color .25s}button{font:inherit;cursor:pointer}.container{width:min(1180px,calc(100% - 32px));margin:0 auto}
#hero{padding:120px 20px 38px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}#hero h1{white-space:nowrap;font-size:clamp(44px,6vw,68px);line-height:.98;letter-spacing:-.05em;margin:0 0 14px}#hero h1 span{display:inline-block;white-space:nowrap;word-break:keep-all;overflow-wrap:normal;text-wrap:nowrap;color:#fff!important;background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important}.subtitle{margin:0 auto;color:var(--text-soft);font-size:17px}.desc{max-width:780px;margin:10px auto 0;color:var(--muted);line-height:1.65;font-size:13px}

.top-area{position:sticky;top:70px;z-index:50;background:rgba(9,10,15,.80);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.10);padding:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.14)}.level-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}.pill{padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);color:var(--muted);font-size:13px;font-weight:650;transition:.2s}.pill:hover{background:rgba(96,165,250,.16);color:#eaf4ff;border-color:rgba(96,165,250,.36)}.pill.active{background:#fff;color:#0b0b0f;border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.16)}.pill:disabled{opacity:.42;cursor:not-allowed}
.main{padding:22px 0 64px}.topic-shell{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}.topic-list,.detail{background:rgba(17,19,26,.88);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 45px rgba(0,0,0,.14)}.topic-list{padding:12px;position:sticky;top:92px;max-height:calc(100vh - 120px);overflow-y:auto;box-shadow:0 12px 35px rgba(0,0,0,.12)}.topic-list::-webkit-scrollbar{width:6px}.topic-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}.topic-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:7px 9px 10px}.topic-btn{width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:10px 11px;margin:2px 0;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:13px;line-height:1.38} .topic-btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topic-btn:hover{background:rgba(96,165,250,.13);color:var(--text);border-color:rgba(96,165,250,.24)}.topic-btn.active{background:rgba(255,255,255,.07);border-color:var(--accent-border);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}.empty{padding:38px 18px;color:var(--dim);text-align:center;font-size:13px}.detail{padding:26px 28px}.detail h2{font-size:32px;line-height:1.08;margin:0 0 18px;letter-spacing:-.035em;color:var(--text)}.story-meta{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--dim);text-align:right;margin:-6px 0 10px}.story{color:var(--text-soft);font-size:15px;line-height:1.75}.story p{margin:0 0 14px;padding:0;border-radius:0}

.section{margin-top:30px}.section-title{font-size:15px;font-weight:750;padding-bottom:9px;border-bottom:1px solid var(--line);margin-bottom:8px;color:var(--text)}.section-note{color:var(--muted);font-size:12px;margin:-2px 0 10px;line-height:1.5}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.08)}.data-table{width:100%;border-collapse:collapse;min-width:560px}.data-table th,.data-table td{padding:12px 13px;border-bottom:1px solid rgba(255,255,255,.08);vertical-align:top;text-align:left;line-height:1.5;font-size:13px}.data-table th{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.045)}.data-table td:first-child{color:var(--text)}.data-table td:last-child{color:var(--muted)}.data-table tr:last-child td{border-bottom:0} .speaker{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);color:var(--text);border-radius:8px;padding:5px 8px;font-size:13px;float:right}.speaker:hover{background:rgba(255,255,255,.08)}.vocab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.vocab-item{padding:14px 14px;min-height:58px;border:1px solid var(--line);background:rgba(255,255,255,.032);border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.08)}.vocab-item:hover{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.28)}.vocab-de{font-weight:700;font-size:13px;line-height:1.4;color:var(--text)}.vocab-en{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-size:12px;margin-bottom:15px;padding:0}.back:hover{color:var(--text)}footer{padding:24px 0 46px;text-align:center;color:var(--dim);font-size:11px}
.theme-toggle{position:fixed;right:20px;top:78px;z-index:100;border:1px solid rgba(255,255,255,.16);background:rgba(17,19,26,.90);color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 22px rgba(0,0,0,.20)}.speakable{cursor:pointer;border-radius:9px;transition:.18s;padding:2px 5px;margin:-2px -5px}.speakable:hover{background:rgba(96,165,250,.12)}.qa-list{display:grid;gap:8px}.qa-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qa-bubble{padding:10px 12px;border-radius:18px;border:1px solid var(--line);line-height:1.55;min-height:0;box-shadow:0 8px 24px rgba(0,0,0,.08)}.qa-question{background:rgba(255,255,255,.035)}.qa-answer{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.045));border-color:rgba(255,255,255,.15)}.qa-bubble:hover{transform:none}.qa-label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:4px;font-weight:800}.qa-en{margin-top:4px;font-size:11.5px;color:var(--muted)}

body.light{--bg:#f4f6f9;--panel:#fff;--line:rgba(20,24,35,.12);--text:#151922;--text-soft:#2d3442;--muted:#586273;--dim:#707a8a;--soft-panel:#f7f8fb;--soft-panel-hover:#f1f3f5;--accent:#5d6470;--accent-border:rgba(20,24,35,.14);background:linear-gradient(180deg,#fbfcfe 0%,#f4f6f9 55%,#eef1f5 100%);color:var(--text)}body.light #hero{background:radial-gradient(circle at 50% 0%,rgba(0,0,0,.04),transparent 42%)}body.light #hero .eyebrow{color:#707a8a}body.light #hero h1 span{color:#111827!important;background:none!important;-webkit-background-clip:initial;background-clip:initial}body.light .subtitle{color:#313846}body.light .desc{color:#667085}body.light .top-area{background:#fff;border-top-color:rgba(20,24,35,.08);border-bottom-color:rgba(20,24,35,.12);box-shadow:0 10px 28px rgba(30,40,60,.08)}body.light .top-area .pill{background:rgba(20,24,35,.035);color:#4b5563;border-color:rgba(20,24,35,.12)}body.light .top-area .pill:hover:not(.active){background:#000!important;color:#fff!important;border-color:#000!important}body.light .pill.active{background:#000;color:#fff;border-color:#000;box-shadow:none}body.light .topic-list,body.light .detail{background:rgba(255,255,255,.96);border-color:rgba(20,24,35,.12);box-shadow:0 14px 34px rgba(25,35,55,.07)}body.light .topic-label{color:#7b8492}body.light .topic-btn{color:#515b6b}body.light .topic-btn:hover{background:#e7f2ff;color:#17324d;border-color:#bfdcf4}body.light .topic-btn.active{background:#000;color:#fff;border-color:#000;box-shadow:none}body.light .detail h2{color:#171b24}body.light .story{color:#2f3745}body.light .story-meta{color:#7b8492}body.light .section-title{color:#171b24;border-bottom-color:rgba(20,24,35,.11)}body.light .section-note{color:#5b6575}body.light .table-wrap{border-color:rgba(20,24,35,.12);background:#fff}body.light .data-table th{color:#6c7686;background:#f5f6f8}body.light .data-table td{border-bottom-color:rgba(20,24,35,.08)}body.light .data-table td:first-child{color:#171b24}body.light .data-table td:last-child{color:#5d6777}body.light .speakable:hover{background:#e7f2ff}body.light .vocab-item{background:#fafbfc;border-color:rgba(20,24,35,.10);box-shadow:0 4px 14px rgba(25,35,55,.045)}body.light .vocab-item:hover{background:#e7f2ff;border-color:#b9d9f5}body.light .vocab-de{color:#171b24}body.light .vocab-en{color:#5f6979}body.light .back{color:#6a7484}body.light .back:hover{color:#17324d;background:#e7f2ff;border-radius:8px;padding:3px 6px;margin-left:-6px}body.light footer{color:#7b8492}body.light .qa-bubble{box-shadow:0 7px 20px rgba(25,35,55,.06)}body.light .qa-question{background:#f7f8fa;border-color:rgba(20,24,35,.11)}body.light .qa-answer{background:linear-gradient(135deg,#f1f3f5,#fafbfc);border-color:rgba(20,24,35,.14)}body.light .qa-label{color:#7b8492}body.light .qa-en{color:#5e6878}body.light .theme-toggle{background:rgba(255,255,255,.96);color:#252b36;border-color:rgba(20,24,35,.13);box-shadow:0 8px 22px rgba(25,35,55,.12)}

@media(max-width:900px){.topic-shell{grid-template-columns:1fr}.topic-list{position:static}.detail{padding:22px}.vocab-grid{grid-template-columns:1fr}.data-table{min-width:500px}}@media(max-width:700px){.qa-row{grid-template-columns:1fr}}@media(max-width:620px){.container{width:calc(100% - 18px)}#hero{padding:92px 12px 24px}#hero h1{white-space:nowrap;font-size:42px}.detail h2{font-size:26px}.story{font-size:14px}.pill{font-size:11px;padding:8px 13px}.detail{padding:17px;border-radius:14px}.topic-list{padding:9px;border-radius:14px}.theme-toggle{right:12px;top:66px;padding:8px 11px;font-size:11px}.story p{margin:0 0 14px;padding:0}.qa-list{gap:7px}.qa-row{gap:7px}.qa-bubble{padding:10px 11px}}

/* Interactive language terms */

<style>
nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 36px;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    transition: background .28s ease, border-color .28s ease, color .28s ease, box-shadow .28s ease;
}
.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    text-decoration: none;
    line-height: 1.15;
}
.logo span {
    display: block;
    font-size: 10.5px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 1.8px;
    text-transform: uppercase;
}
.nav-links {
    display: flex;
    gap: 28px;
    align-items: center;
}
.nav-links a {
    color: rgba(255, 255, 255, 0.55);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    transition: all 0.22s;
    cursor: pointer;
    position: relative;
}
.nav-links a:hover {
    color: #fff;
}
.nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 1.5px;
    background: #fff;
    transition: width 0.22s;
}
.nav-links a:hover::after {
    width: 100%;
}
.nav-links a.active { color:#fff; }
.nav-links a.active::after { width:100%; }
@media (max-width: 768px) {
    nav { padding: 14px 18px; }
    .nav-links { gap: 16px; }
    .logo { font-size: 20px; }
    .logo span { font-size: 9px; }
}

/* Bright mode nav */
body.light nav {
    background: transparent;
    border-bottom-color: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
}
body.light nav .logo { color:#000; }
body.light nav .logo span { color: rgba(0,0,0,.46); }

function renderCinemaStyleRows(rows, host, title, intro='') {
    const normalized = rows || [];
    let html = `<h2>${escapeHtml(title)}</h2>`;
    if (intro) html += `<div class="story"><p>${escapeHtml(intro)}</p></div>`;
    html += `<div class="cinema-table-wrap"><table class="cinema-table"><thead><tr><th>Word</th><th>Meaning</th><th>Example sentence</th><th aria-label="Audio"></th></tr></thead><tbody>`;
    normalized.forEach((r, index) => {
        const word = r[0] || '';
        const meaning = r[1] || '';
        const sentence = r[2] || '';
        const translation = r[3] || '';
        html += `<tr><td><strong>${escapeHtml(word)}</strong></td><td>${escapeHtml(meaning)}</td><td>${escapeHtml(sentence)}<span class="cinema-translation"> ${escapeHtml(translation)}</span></td><td><button class="cinema-speaker" type="button" title="Say the word, then the sentence" data-word="${escapeHtml(word)}" data-sentence="${escapeHtml(sentence)}">🔊</button></td></tr>`;
    });
    html += '</tbody></table></div>';
    host.innerHTML = html;
    host.querySelectorAll('.cinema-speaker').forEach(btn => btn.addEventListener('click', () => speakSequence(btn.dataset.word, btn.dataset.sentence)));
}

function renderComparisonCinema(host) {
    const rows = [
        ['so ... wie','as ... as','Mein Bruder ist so groß wie ich.','My brother is as tall as I am.'],
        ['genauso ... wie','just as ... as','Sie ist genauso freundlich wie ihre Schwester.','She is just as friendly as her sister.'],
        ['nicht so ... wie','not as ... as','Der Film ist nicht so spannend wie die Serie.','The film is not as exciting as the series.'],
        ['fast so ... wie','almost as ... as','Das neue Auto ist fast so schnell wie das alte.','The new car is almost as fast as the old one.'],
        ['halb so ... wie','half as ... as','Der Weg ist halb so lang wie gestern.','The route is half as long as yesterday.'],
        ['mehr ... als','more ... than','Heute habe ich mehr Zeit als gestern.','Today I have more time than yesterday.'],
        ['weniger ... als','less ... than','Der zweite Text ist weniger kompliziert als der erste.','The second text is less complicated than the first.'],
        ['je ... desto','the ... the ...','Je mehr du übst, desto besser sprichst du Deutsch.','The more you practise, the better you speak German.']
    ];
    renderCinemaStyleRows(rows, host, 'Comparisons', 'Common German comparison patterns with practical example sentences.');
}

    const seen = new Set();

    CINEMA_DATA.forEach(item => {
        const key = item.category + '|' + item.sub;
        if (!seen.has(key)) {
            seen.add(key);
            groups.push({category:item.category, sub:item.sub});
        }
    });

    groups.forEach((group, index) => {
        const btn = document.createElement('button');
        btn.className = 'topic-btn';
        if(index === 0) btn.classList.add('active');
        const CINEMA_SUBTITLES = {
            'Krimi & Spannung':'Crime & Suspense',
            'Krimi & Konflikt':'Crime & Conflict',
            'Emotionen & Beziehungen':'Emotions & Relationships',
            'Beziehungen & Gefühle':'Relationships & Feelings',
            'Emotionen & Charakter':'Emotions & Character',
            'Spannung & Risiko':'Tension & Risk',
            'Handlung & Bewegung':'Action & Movement',
            'Kommunikation & Entscheidungen':'Communication & Decisions',
            'Alltag & Leistung':'Everyday Life & Performance',
            'Alltag, Arbeit & Freizeit':'Everyday Life, Work & Leisure',
            'Gesellschaft & Geschichte':'Society & History',
            'Konnektoren & Signalwörter':'Connectors & Signal Words'
        };
        btn.textContent = `🎬 ${CINEMA_SUBTITLES[group.sub] || group.sub}`;

        btn.addEventListener('click', () => {
            topicButtonsContainer.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCinemaTopic(group.category, group.sub);
        });

        topicButtonsContainer.appendChild(btn);
    });

    if(groups.length) renderCinemaTopic(groups[0].category, groups[0].sub);
    else detailContainer.innerHTML = '<div class="empty">Keine Themen verfügbar.</div>';
}

function renderCinemaTopic(category, sub){
    const rows = CINEMA_DATA.filter(item => item.category === category && item.sub === sub);

    let html = `<h2>${escapeHtml(sub)}</h2>`;
    html += `<div class="story"><p>Wortschatz aus Kino &amp; Serien.</p></div>`;
    html += `<div class="cinema-table-wrap"><table class="cinema-table"><thead><tr>
        <th>Word</th><th>Meaning</th><th>Example sentence</th><th aria-label="Audio"></th>
    </tr></thead><tbody>`;

    rows.forEach((r, index) => {
        const opposite = r.opposite ? `<span class="cinema-opposite">↔ ${escapeHtml(r.opposite)}</span>` : '';
        html += `<tr>
            <td><strong>${escapeHtml(r.german)}</strong>${opposite}</td>
            <td>${escapeHtml(r.english)}</td>
            <td>${escapeHtml(r.sentence)}<span class="cinema-translation"> ${escapeHtml(r.translation)}</span></td>
            <td><button class="cinema-speaker" type="button" title="Say the word, then the sentence"
                data-word="${escapeHtml(r.german)}"
                data-sentence="${escapeHtml(r.sentence)}">🔊</button></td>
        </tr>`;
    });

    html += '</tbody></table></div>';
    detailContainer.innerHTML = html;

    detailContainer.querySelectorAll('.cinema-speaker').forEach(btn => {
        btn.addEventListener('click', () => speakSequence(btn.dataset.word, btn.dataset.sentence));
    });
}

amilie organisierte eine private Beerdigung für das Opfer.","The family organized a private funeral for the victim."],["die Affäre","affair","Der Ehemann verheimlichte seiner Frau die stürmische Affäre.","The husband hid the turbulent affair from his wife."],["der Betrug","fraud/deception","Der Geschäftsmann wurde wegen Betrugs vor Gericht angeklagt.","The businessman was accused of fraud in court."],["die Beute","loot/booty","Die Räuber versteckten die Beute in einem verlassenen Haus.","The robbers hid the loot in an abandoned house."],["die Wut","anger/rage","Der Chef konnte seine Wut über den Fehler nicht verbergen.","The boss couldn't hide his anger about the mistake."],["die Träne","tear","Die Mutter weinte heiße Tränen über den Verlust ihres Sohnes.","The mother cried hot tears over the loss of her son."],["das Gefühl","feeling/emotion","Der Angeklagte zeigte kein Gefühl für das Leid des Opfers.","The accused showed no feeling for the victim's suffering."],["die Justiz","justice system","Die Justiz musste den Fall der Entführung neu aufrollen.","The justice system had to reopen the kidnapping case."],["die Absicht","intention","Der Verdächtige hatte die klare Absicht, das Verbrechen zu begehen.","The suspect had the clear intention to commit the crime."],["die Ehre","honor","Der Anwalt verteidigte die Ehre seines unschuldigen Mandanten.","The lawyer defended the honor of his innocent client."],["die Rache","revenge","Der Bruder des Opfers schwor bittere Rache an den Täter.","The victim's brother swore bitter revenge on the perpetrator."],["der Retter","savior","Der Feuerwehrmann wurde als Retter des Kindes gefeiert.","The firefighter was celebrated as the child's savior."],["das Rätsel","mystery/riddle","Der Detektiv löste das schwierige Rätsel des verschwundenen Juwels.","The detective solved the difficult mystery of the missing jewel."],["die Rettung","rescue","Die Rettung der Geiseln war eine schwierige Operation.","The rescue of the hostages was a difficult operation."],["die Warnung","warning","Die Polizei gab eine dringende Warnung an die Bevölkerung heraus.","The police issued an urgent warning to the population."],["die Erlaubnis","permission","Der Detektiv holte sich die Erlaubnis für die Hausdurchsuchung.","The detective got permission for the house search."],["das Verbot","ban/prohibition","Der Richter erließ ein striktes Verbot der Annäherung.","The judge issued a strict ban on approaching."],["der Neid","envy","Der Kollege konnte seinen Neid auf den erfolgreichen Anwalt nicht verbergen.","The colleague couldn't hide his envy of the successful lawyer."],["die Schuldigen","culprits/guilty ones","Die Polizei verhaftete endlich die wahren Schuldigen des Raubes.","The police finally arrested the true culprits of the robbery."],["die Ausdauer","perseverance","Der Ermittler brauchte große Ausdauer für die jahrelange Suche.","The investigator needed great perseverance for the years-long search."],["der Lärm","noise","Der Nachbar beschwerte sich über den nächtlichen Lärm.","The neighbor complained about the nighttime noise."],["die Ordnung","order","Der Chef verlangte absolute Ordnung in den Akten.","The boss demanded absolute order in the files."]],"nounOpposites":[["der Brief / die E-Mail","letter / email","Meine Oma schickt mir immer einen Brief, aber ich schreibe ihr lieber eine E-Mail, weil es schneller ist.","My grandma always sends me a letter, but I prefer to write her an email because it's faster."],["die Absage / die Zusage","rejection / acceptance","Zuerst hat er die Absage für die Wohnung bekommen, aber dann hat er doch noch die Zusage erhalten.","First he got the rejection for the apartment, but then he still received the acceptance."],["die Einladung / die Ausladung","invitation / uninviting","Ich habe die Einladung zur Party bekommen, aber nach dem Streit habe ich leider die Ausladung bekommen.","I received the invitation to the party, but after the argument I unfortunately received the uninviting."],[ er has a lot of experience, but the young teacher makes many mistakes because of inexperience."],["das Gehalt / die Unkosten","salary / expenses","Sein monatliches Gehalt ist gut, aber die Unkosten für die Wohnung sind sehr hoch.","His monthly salary is good, but the expenses for the apartment are very high."],["die Heimat / die Fremde","home country / foreign country","In seiner Heimat fühlt er sich wohl, aber in der Fremde vermisst er seine Familie.","In his home country he feels comfortable, but in the foreign country he misses his family."],["der Ratschlag / die Fehlinformation","advice / misinformation","Der Lehrer gibt mir einen guten Ratschlag, aber die Fehlinformation von meinem Freund führt zu einem Fehler.","The teacher gives me good advice, but my friend's misinformation leads to a mistake."],["der Unterschied / die Ähnlichkeit","difference / similarity","Der Unterschied zwischen den beiden Autos ist klein, aber die Ähnlichkeit der Farben ist groß.","The difference between the two cars is small, but the similarity of the colors is big."],["die Veranstaltung / die Absage","event / cancellation","Die Veranstaltung war gut geplant, aber die plötzliche Absage des Redners macht alles kaputt.","The event was well planned, but the sudden cancellation by the speaker ruins everything."],["die Vorbereitung / die Nachbereitung","preparation / follow-up","Die Vorbereitung für den Urlaub ist wichtig, aber auch die Nachbereitung nach der Reise ist nützlich.","The preparation for the vacation is important, but the follow-up after the trip is also useful."]],"verbs":[["abfragen","to double check/test","Der Lehrer fragte die Vokabeln bei den Schülern ab.","The teacher tested the vocabulary with the students."],["aufhören","to stop","Der Regen hörte endlich auf, als die Polizei ankam.","The rain finally stopped when the police arrived."],["aufpassen","to pay attention/watch out","Die Mutter passte auf ihre Kinder im Park auf.","The mother watched out for her children in th e to cancel because we have no time."],["einladen / ausladen","invite / uninvite","Ich lade alle Freunde zur Party ein, aber ich lade meinen Bruder wieder aus, weil er böse war.","I invite all friends to the party, but I uninvite my brother because he was mean."],["erklären / verwirren","explain / confuse","Der Lehrer erklärt die Grammatik gut, aber die vielen Regeln verwirren die Schüler.","The teacher explains the grammar well, but the many rules confuse the students."],["mitnehmen / dalassen","take along / leave behind","Ich will meinen Regenschirm mitnehmen, aber ich lasse ihn zu Hause da.","I want to take my umbrella along, but I leave it behind at home."],["passieren / verhindern","happen / prevent","Der Unfall passiert trotz aller Vorsicht, aber die Polizei kann Schlimmeres verhindern.","The accident happens despite all caution, but the police can prevent worse."],["umziehen / bleiben","move house / stay","Die Familie will in eine größere Wohnung umziehen, aber die Kinder wollen lieber in der alten Schule bleiben.","The family wants to move to a larger apartment, but the children prefer to stay in the old school."],["verstehen / missverstehen","understand / misunderstand","Der Chef versteht die Situation gut, aber der neue Mitarbeiter missversteht die Anweisung.","The boss understands the situation well, but the new employee misunderstands the instruction."]],"adjectives":[["unmöglich","impossible","Die Flucht aus dem Hochsicherheitsgefängnis war unmöglich.","The escape from the high-security prison was impossible."],["schlau","clever/smart","Der Detektiv war schlau genug, die Falle zu durchschauen.","The detective was clever enough to see through the trap."],["nett","nice","Die Nachbarin war sehr nett und half der Polizei.","The neighbor was very nice and helped the police."],["naiv","naive","Die Geisel war naiv genug, dem Entführer zu vertrauen.","The hostage was naive enough to trust the kidnapper."],["treu","loyal/faithful","Der Ehemann blieb seiner Frau function renderBankTable(rows, columns = ['Word','Meaning','Example sentence','Translation']) {
    if (!rows || !rows.length) return '<div class="empty">Alle Wörter dieses Bereichs sind bereits vorhanden.</div>';
    return `<div class="bank-table-wrap"><table class="bank-table"><thead><tr>${columns.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr></thead><tbody>${
        rows.map(r=>{
            const cells = r.map((cell,i)=>{
                const value=escapeHtml(cell);
                return i===3 ? `<td>${value}</td>` : `<td>${value}</td>`;
            }).join('');
            return `<tr>${cells}</tr>`;
        }).join('')
    }</tbody></table></div>`;
}

function renderBankTopic(title, note, rows, host=document.getElementById('detail')) {
    host.innerHTML = `<h2>${escapeHtml(title)}</h2><p class="bank-note">${escapeHtml(note)}</p>${renderBankTable(rows)}`;
}

function mergeImportedEndings() {
    Object.entries(IMPORTED_VOCAB.endings).forEach(([key, rows]) => {
        if (!rows.length || !ENDINGS_DATA[key]) return;
        const existing = new Set(ENDINGS_DATA[key].rows.map(r => String(r[1]).toLowerCase()));
        rows.forEach(r => {
            const derived = String(r[1]).toLowerCase();
            if (!existing.has(derived)) {
                ENDINGS_DATA[key].rows.push(r);
                existing.add(derived);
            }
        });
    });
}

function renderGoetheCategoryTable(topicName, rows, note='') {
    renderCinemaStyleRows(rows, detailContainer, topicName, note);
}

function addGoetheA1A2Topics() {
    const labels = {nouns:'Nouns', verbs:'Verbs', adjectives:'Adjectives', other:'Other'};

    Object.entries(GOETHE_A1A2).forEach(([category, topicMap]) => {
        if (!VOCAB_DATA[category]) VOCAB_DATA[category] = {label: labels[category], topics: []};
        if (!Array.isArray(VOCAB_DATA[category].topics)) VOCAB_DATA[category].topics = [];

        Object.entries(topicMap).forEach(([topicName, rows]) => {
            VOCAB_DATA[category].topics.push({
                title: topicName,
                html: `<div class="goethe-a1a2-host" data-category="${category}" data-topic="${escapeHtml(topicName)}"></div>`
            });
        });
    });
}

function wireGoetheHost(host) {
    const topicName = host.dataset.topic || '';
    const category = host.dataset.category || '';
    const rows = GOETHE_A1A2[category] && GOETHE_A1A2[category][topicName];
    if (!rows) return;
    renderGoetheCategoryTable(topicName, rows, '');
}


function wireOtherCinemaHost(host) {
    const key = host.dataset.otherKey || '';
    const title = host.dataset.otherTitle || 'Other';
    const rows = (IMPORTED_VOCAB[key] || []).map(r => [r[0], r[1], r[2], r[3]]);
    renderCinemaStyleRows(rows, host, title, 'Useful words, connectors and expressions for everyday German.');
}

function patchGoetheHostRendering() {
    const original = renderTopicContent;
    renderTopicContent = function(topic) {
        detailContainer.innerHTML = topic.html;
            const basicNounHost=detailContainer.querySelector('.basic-noun-host'); if(basicNounHost){const t=basicNounHost.dataset.title; if(BASIC_NOUN_ROWS[t]) renderSharedVocabularyTable(t,'Core nouns with a natural example sentence and English translation.',BASIC_NOUN_ROWS[t],detailContainer);}
            const pronounHost=detailContainer.querySelector('.pronoun-noun-host'); if(pronounHost){renderSharedVocabularyTable('Pronouns & Connectors','Useful pronouns and connectors grouped under Nouns.',IMPORTED_VOCAB.connectors||[],detailContainer);}
            const host = detailContainer.querySelector('.goethe-a1a2-host');
            if (host) wireGoetheHost(host);
            const otherCinemaHost = detailContainer.querySelector('.other-cinema-host');
            if (otherCinemaHost) wireOtherCinemaHost(otherCinemaHost);

            const endingHost = detailContainer.querySelector('.ending-topic');
            if (endingHost) renderEndingTopic(endingHost.dataset.ending, endingHost);
            const similarHost = detailContainer.querySelector('.similar-topic');
            if (similarHost) renderSimilarTopic(similarHost.dataset.type, similarHost.dataset.category, similarHost);
            const crimeNounHost = detailContainer.querySelector('.crime-drama-nouns');
            if (crimeNounHost) renderCrimeDramaNouns(crimeNounHost);
            const crimeHost = detailContainer.querySelector('.crime-drama-adjectives');
            if (crimeHost) renderCrimeDramaAdjectives(crimeHost);
            const comparisonHost = detailContainer.querySelector('.comparison-cinema-host');
            if (comparisonHost) renderComparisonCinema(comparisonHost);

    };
}

addImportedTopics();
mergeImportedEndings();
addGoetheA1A2Topics();
patchGoetheHostRendering();

const pills = document.querySelectorAll('.pill');
const topicLabel = document.getElementById('topicLabel');
const topicButtonsContainer = document.getElementById('topicButtons');
const detailContainer = document.getElementById('detail');
const themeToggle = document.getElementById('themeToggle');

let currentCategory = 'nouns'; // Default matches the HTML active pill

function init() {
    setupPills();
    setupThemeToggle();
    loadCategory(currentCategory);
}

function setupPills() {
    pills.forEach(pill => {
        pill.addEventListener('click', (e) => {
            pills.forEach(p => p.classList.remove('active'));
            e.currentTarget.classList.add('active');

            const category = e.currentTarget.getAttribute('data-category');
            if (!category) return;
            currentCategory = category;
            loadCategory(category);
        });
    });
}

function parseVerbRowsFromTopic(topicHtml) {
    const wrap = document.createElement('div');
    wrap.innerHTML = topicHtml || '';
    return Array.from(wrap.querySelectorAll('.verb-rowbox')).map((row, index) => {
        const forms = row.querySelector('.verb-forms')?.innerText?.trim() || '';
        const meaning = row.querySelector('.verb-meaning')?.innerText?.trim() || '';
        const german = row.querySelector('.verb-example-de')?.innerText?.trim() || '';
        const english = (row.querySelector('.verb-example-en')?.innerText || '').replace(/^\s*/,'').trim();
        const number = row.querySelector('.verb-number')?.innerText?.trim() || String(index+1).padStart(3,'0');
        return [forms, meaning, german, english, number];
    });
}

function renderVerbTopic(topic, host) {
    const rows = parseVerbRowsFromTopic(topic.html);
    const sourceWrap = document.createElement('div');
    sourceWrap.innerHTML = topic.html || '';
    const sourceRows = Array.from(sourceWrap.querySelectorAll('.verb-rowbox'));

    let html = `<h2>${escapeHtml(topic.title)}</h2>`;
    html += `<div class="cinema-table-wrap verb-table-container"><table class="cinema-table verb-cinema-table"><thead><tr><th>Verb forms</th><th>Meaning</th><th>Example sentence</th><th aria-label="Audio"></th></tr></thead><tbody>`;
    rows.forEach((r, index) => {
        const forms = r[0], meaning = r[1], sentence = r[2], translation = r[3];
        const sourceRow = sourceRows[index];
        const formsHtml = sourceRow?.querySelector('.verb-forms')?.innerHTML || escapeHtml(forms);
        const spokenForm = forms.replace(/\s*\/\s*/g, ' / ').split(' / ')[0].trim();
        html += `<tr><td><div class="verb-forms">${formsHtml}</div></td><td>${escapeHtml(meaning)}</td><td>${escapeHtml(sentence)}<span class="cinema-translation"> ${escapeHtml(translation)}</span></td><td><button class="cinema-speaker" type="button" title="Say the verb form, then the sentence" data-word="${escapeHtml(spokenForm)}" data-sentence="${escapeHtml(sentence)}">🔊</button></td></tr>`;
    });
    html += '</tbody></table></div>';
    host.innerHTML = html;
    host.querySelectorAll('.cinema-speaker').forEach(btn => btn.addEventListener('click', () => speakSequence(btn.dataset.word, btn.dataset.sentence)));
}

function renderVerbsCategory() {
    topicLabel.textContent = 'Verbs · Subtopics';
    topicButtonsContainer.innerHTML = '';
    const topics = VOCAB_DATA.verbs?.topics || VERB_PATTERN_TOPICS;
    topics.forEach((topic, index) => {
        const btn = document.createElement('button');
        btn.className = 'topic-btn';
        if (index === 0) btn.classList.add('active');
        btn.textContent = topicButtonLabel(topic.title, 'verbs');
        btn.addEventListener('click', () => {
            topicButtonsContainer.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (topic.title === 'Adverbs & Other Words') {
                renderTopicContent(topic);
            } else {
                renderVerbTopic(topic, detailContainer);
            }
        });
        topicButtonsContainer.appendChild(btn);
    });
    if (topics.length) {
        const first = topics[0];
        if (first.title === 'Adverbs & Other Words') renderTopicContent(first);
        else renderVerbTopic(first, detailContainer);
    }
}

function topicButtonLabel(title, categoryKey) {
    if (categoryKey === 'adjectives' || categoryKey === 'other' || categoryKey === 'similar') return title;
    const t = String(title).toLowerCase();
    const rules = [
        [/crime|drama|mystery|suspense|conflict/, '🎬'],
        [/food|drink|eat|meal|restaurant|shop|shopping/, '🍽️'],
        [/home|room|furniture|daily|routine|house|accommodation/, '🏠'],
        [/school|learn|education|class|study/, '📚'],
        [/family|people|friend|occupation|person/, '👥'],
        [/money|service|market|store|business/, '🛍️'],
        [/transport|travel|countries|direction|place|document/, '✈️'],
        [/free time|hobby|entertainment|celebration|party|leisure/, '🎯'],
        [/communication|technology|writing|speaking|phrase|connector/, '💬'],
        [/weather|nature|season/, '🌦️'],
        [/health|body|medical/, '🏥'],
        [/verb|participle|perfect|prefix|strong|weak|separable|inseparable|modal/, '⚙️'],
        [/grammar|sentence|case|negation|preposition/, '📝'],
        [/time|date|month|measurement|number/, '⏰']

function loadCategory(categoryKey) {
    if (categoryKey === 'endings') { renderEndingsCategory(); return; }
    if (categoryKey === 'komposita') { renderKompositaCategory(); return; }
    if (categoryKey === 'similar') { renderSimilarCategory(); return; }
    if (categoryKey === 'cinema') { renderCinemaCategory(); return; }
    if (categoryKey === 'verbs') { renderVerbsCategory(); return; }

    const data = VOCAB_DATA[categoryKey];
    if (!data) {
        topicLabel.textContent = 'Vocabulary · Subtopics';
        topicButtonsContainer.innerHTML = '';
        detailContainer.innerHTML = '<div class="empty">Keine Themen verfügbar.</div>';
        return;
    }

    const navLabels = {nouns:'Nouns', adjectives:'Adjectives', other:'Other', endings:'Word Endings', similar:'Similar Words'};
    topicLabel.textContent = (navLabels[categoryKey] || data.label || 'Vocabulary') + ' · Subtopics';
    topicButtonsContainer.innerHTML = '';

    data.topics.forEach((topic, index) => {
        const btn = document.createElement('button');
        btn.className = 'topic-btn';
        if (index === 0) btn.classList.add('active');
        btn.textContent = topic.title;

        btn.addEventListener('click', () => {
            topicButtonsContainer.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTopicContent(topic);
        });

        topicButtonsContainer.appendChild(btn);
    });

    if (data.topics.length > 0) {
        renderTopicContent(data.topics[0]);
    } else {
        detailContainer.innerHTML = '<div class="empty">Keine Themen verfügbar.</div>';
    }
}

function renderEndingsCategory() {
    topicLabel.textContent = 'Endings · Word Families';
    topicButtonsContainer.innerHTML = '';
    const groups = Object.keys(ENDINGS_DATA);
    groups.forEach((key,index) => {
        const btn=document.createElement('button');

            topicButtonsContainer.querySelectorAll('.topic-btn').forEach(b=>b.classList.remove('active'));

            renderEndingTopic(key, detailContainer);
        });
        topicButtonsContainer.appendChild(btn);
    });
    if(groups.length) renderEndingTopic(groups[0], detailContainer);
}

                                ${escapeHtml(r.sentence)}
                                <span class="similar-example-translation">${escapeHtml(r.explanation || '')}</span>
                            </td>
                            <td>
                                <button class="similar-speaker" type="button"
                                    title="Say the word, then the sentence"
                                    data-word="${escapeHtml(r.german)}"
                                    data-sentence="${escapeHtml(r.sentence)}">🔊</button>
                            </td>
                        </tr>`).join('')}
                </tbody>
            </table>
        </div>
    `;
    host.querySelectorAll('.similar-speaker').forEach(btn => {
        btn.addEventListener('click', () => speakSequence(btn.dataset.word, btn.dataset.sentence));
    });
}

function renderEndingWord(word, key) {
    const safeWord = escapeHtml(word);
    const lower = word.toLowerCase();
    let suffixes = [];
    const k = String(key).toUpperCase();
    if (k === 'HEIT / KEIT') suffixes = ['heit','keit'];
    else if (k === 'UNG') suffixes = ['ung'];
    else if (k === 'LICH') suffixes = ['lich'];
    else if (k === 'ISCH') suffixes = ['isch'];
    else if (k === 'IEREN') suffixes = ['ieren'];
    else if (k === 'SCHAFT') suffixes = ['schaft'];
    else if (k === 'TION') suffixes = ['tion'];
    else if (k === 'CHEN') suffixes = ['chen'];
    const match = suffixes.map(x => ({x, i: lower.lastIndexOf(x)})).filter(o => o.i > 0).sort((a,b) => b.i-a.i)[0];
    if (!match) return safeWord;
    const i = match.i;
    return escapeHtml(word.slice(0,i)) + '<strong>' + escapeHtml(word.slice(i)) + '</strong>';
}

function renderEndingTopic(key, host) {
    const set = ENDINGS_DATA[key];
    if (!set) {
        host.innerHTML = '<div class="empty">Keine Daten für diese Endung.</div>';
        return;
    }

    const rows = set.rows;
    let html = `<h2 class="ending-title">${escapeHtml(key)}</h2>`;
    html += `<p class="ending-note">${escapeHtml(set.note)}</p>`;
    html += `<div class="ending-table-wrap"><table class="ending-table"><thead><tr><th>Word</th><th>Meaning</th><th>Example sentence</th><th aria-label="Audio"></th></tr></thead><tbody>`;

    rows.forEach((r) => {
        html += `<tr>
            <td>${renderEndingWord(r[1], key)}<span class="ending-root">${escapeHtml(r[0])}</span></td>
            <td><span class="ending-en">${escapeHtml(r[2])}</span></td>
            <td>${escapeHtml(r[3])}<span class="ending-translation">${escapeHtml(r[4])}</span></td>
            <td><button class="ending-speaker" type="button" title="Say the word, then the sentence" data-word="${escapeHtml(r[1]).replace(/&quot;/g, '&quot;')}" data-sentence="${escapeHtml(r[3]).replace(/&quot;/g, '&quot;')}">🔊</button></td>
        </tr>`;
    });

    html += '</tbody></table></div>';
    host.innerHTML = html;

    host.querySelectorAll('.ending-speaker').forEach(btn => {
        btn.addEventListener('click', () => speakSequence(btn.dataset.word, btn.dataset.sentence));
    });
}

function speakSequence(word, sentence) {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const first = new SpeechSynthesisUtterance(word);
    first.lang = 'de-DE';
    first.rate = .84;
    const second = new SpeechSynthesisUtterance(sentence);
    second.lang = 'de-DE';
    second.rate = .84;
    first.onend = () => setTimeout(() => speechSynthesis.speak(second), 800);
    speechSynthesis.speak(first);
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
}

function setupThemeToggle() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') {
        document.body.classList.add('light');
        themeToggle.textContent = '☾ Dunkel';
    }

    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light');
        const isLight = document.body.classList.contains('light');
        themeToggle.textContent = isLight ? '☾ Dunkel' : '☀︎ Hell';
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
}

    if (adverbTopic) adverbTopic.html = '<div class="source-adverb-host"></div>';
}
